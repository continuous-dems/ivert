[build-system]
requires = ["hatchling>=1.5.0", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "ivert"
dynamic = ["version"]
description = "The ICESat-2 Validation of Elevations Reporting Tool (IVERT)"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Michael MacFerrin", email = "michael.macferrin@colorado.edu"},
]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = ["Geospatial"]
dependencies = [
    "click",
    "colorama; platform_system == 'Windows'",
    "dateparser",
    "geopandas",
    "h5py",
    "matplotlib",
    "netCDF4",
    "numexpr",
    "numpy",
    "packaging",
    "pandas",
    "psutil",
    "pyogrio",
    "pyproj",
    "rasterio",
    "scipy",
    "shapely",
    "tables",
    "tabulate",
    "tqdm",
    "xarray",
    "fetchez>=0.6.13",
    "globato>=0.3.9",
    "transformez>=1.0.0",
]

[dependency-groups]
test = [
    "pytest>=8",
    "pytest-cov",
]
docs = [
    "sphinx<9.0.0",  # temp pin for sphinx-click
    "sphinx-autodoc-typehints>=2.0.1",
    "sphinx-click>=6.0",
    "pydata-sphinx-theme",
    "myst-parser",
]

[project.urls]
Source = "https://github.com/continuous-dems/ivert"

[project.scripts]
ivert = "ivert.cli:ivert_cli"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.version]
path = "src/ivert/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ivert"]

[tool.pytest.ini_options]
# Keep a bare "pytest" out of build/, data/ and scratch_data/.
testpaths = ["tests"]
# What these options do: see "Tests" in CONTRIBUTING.md.
addopts = "--strict-markers --strict-config --import-mode=importlib -m 'not network and not slow'"
markers = [
    "network: hits a third-party network dependency; needs Earthdata credentials in ~/.netrc",
    "slow: a test that takes too long to run every time (i.e. tens of seconds or more)",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN001",   # missing-type-function-argument
    "ANN201",   # missing-return-type-undocumented-public-function
    "ANN202",   # missing-return-type-private-function
    "C901",     # complex-structure
    "CPY001",   # missing-copyright-notice
    "E501",     # line-too-long
    "FBT001",   # boolean-type-hint-positional-argument
    "FBT002",   # boolean-default-value-positional-argument
    "PLC0415",  # import-outside-top-level
    "PLR0912",  # too-many-branches
    "PLR0913",  # too-many-arguments
    "PLR0915",  # too-many-statements
    "PLR0917",  # too-many-positional-arguments
    "PLR2004",  # magic-value-comparison
    "PTH100",   # os-path-abspath
    "PTH102",   # os-mkdir
    "PTH103",   # os-makedirs
    "PTH107",   # os-remove
    "PTH109",   # os-getcwd
    "PTH110",   # os-path-exists
    "PTH111",   # os-path-expanduser
    "PTH112",   # os-path-isdir
    "PTH113",   # os-path-isfile
    "PTH117",   # os-path-isabs
    "PTH118",   # os-path-join
    "PTH119",   # os-path-basename
    "PTH120",   # os-path-dirname
    "PTH122",   # os-path-splitext
    "PTH123",   # builtin-open
    "PTH202",   # os-path-getsize
    "PTH207",   # glob
    "PTH208",   # os-listdir
    "S101",     # assert
    "SLF001",   # private-member-access
    # Permanent: TRY003 wants a custom exception class for every multi-word message.
    # Most of ours are one-off argument checks or click exceptions, whose message
    # is what the user sees, so a class per message would add nothing.
    "TRY003",   # raise-vanilla-args
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"conf.py" = ["A001"]
# tests/ is deliberately not a package, which INP001 forbids.
"tests/**" = ["INP001"]
