[build-system]
requires = ["hatchling>=1.5.0", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "ivert"
dynamic = ["version"]
description = "The ICESat-2 Validation of Elevations Reporting Tool (IVERT)"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Michael MacFerrin", email = "michael.macferrin@colorado.edu"},
]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = ["Geospatial"]
dependencies = [
    "click",
    "dateparser",
    "gdal",
    "geopandas",
    "h5py",
    "matplotlib",
    "netCDF4",
    "numexpr",
    "numpy",
    "packaging",
    "pandas",
    "psutil",
    "pyproj",
    "rasterio",
    "scipy",
    "shapely",
    "six",
    "tabulate",
    "xarray",
    "fetchez",
    "globato",
    "transformez",
]

[project.urls]
Source = "https://github.com/ciresdem/IVERT"

[project.scripts]
ivert = "ivert.cli:ivert_cli"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.version]
path = "src/ivert/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ivert"]
