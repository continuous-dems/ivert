[build-system]
requires = ["hatchling>=1.5.0", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "ivert"
dynamic = ["version"]
description = "The ICESat-2 Validation of Elevations Reporting Tool (IVERT)"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Michael MacFerrin", email = "michael.macferrin@colorado.edu"},
]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = ["Geospatial"]
dependencies = [
    "click>=8.1.7",
    "colorama>=0.4.6; platform_system == 'Windows'",
    "dateparser>=1.2.0",
    "geopandas>=1.0.0",
    "h5py>=3.12.1",
    "matplotlib>=3.8.0",
    "netCDF4>=1.7.1.post1",
    "numpy>=1.26.0",
    "packaging>=23.2",
    "pandas>=2.1.2",
    "psutil>=5.9.6",
    "pyogrio>=0.8.0",
    "pyproj>=3.7.0",
    "rasterio>=1.4.1",
    "scipy>=1.11.2",
    "shapely>=2.0.3",
    "tables>=3.10.0",
    "tabulate>=0.9.0",
    "tqdm>=4.66.0",
    "xarray>=2023.10.0",
    "fetchez>=0.9.1",
    "globato>=0.3.9",
    "transformez>=1.0.0",
]

[dependency-groups]
test = [
    "pytest>=8",
    "pytest-cov",
]
docs = [
    "sphinx<9.0.0",  # temp pin for sphinx-click
    "sphinx-autodoc-typehints>=2.0.1",
    "sphinx-click>=6.0",
    "pydata-sphinx-theme",
    "myst-parser",
]

[project.urls]
Source = "https://github.com/continuous-dems/ivert"

[project.scripts]
ivert = "ivert.cli:ivert_cli"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.version]
path = "src/ivert/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ivert"]

[tool.pytest.ini_options]
# Keep a bare "pytest" out of build/, data/ and scratch_data/.
testpaths = ["tests"]
# What these options do: see "Tests" in CONTRIBUTING.md.
addopts = "--strict-markers --strict-config --import-mode=importlib -m 'not network and not slow'"
markers = [
    "network: hits a third-party network dependency; needs Earthdata credentials in ~/.netrc",
    "slow: a test that takes too long to run every time (i.e. tens of seconds or more)",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN001",   # missing-type-function-argument
    "ANN201",   # missing-return-type-undocumented-public-function
    "ANN202",   # missing-return-type-private-function
    "C901",     # complex-structure
    # Permanent: CPY001 wants a copyright notice at the top of every file. The MIT
    # LICENSE at the repository root already covers all of them.
    "CPY001",   # missing-copyright-notice
    "E501",     # line-too-long
    "PLR0912",  # too-many-branches
    # Permanent: PLR0913 caps a function at five parameters, keyword-only ones
    # included. Each click option is its own parameter, and the validation functions
    # take the same options, so the only fix is to bundle them into objects. Long
    # argument lists are kept safe by making all but the first few keyword-only,
    # which PLR0917 enforces.
    "PLR0913",  # too-many-arguments
    "PLR0915",  # too-many-statements
    # Permanent: TRY003 wants a custom exception class for every multi-word message.
    # Most of ours are one-off argument checks or click exceptions, whose message
    # is what the user sees, so a class per message would add nothing.
    "TRY003",   # raise-vanilla-args
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"conf.py" = ["A001"]
# tests/ is deliberately not a package, which INP001 forbids. pytest checks with
# assert (S101), unit tests call the private helpers they test (SLF001), and an
# assertion's expected value reads best written out in it (PLR2004).
"tests/**" = ["INP001", "PLR2004", "S101", "SLF001"]
