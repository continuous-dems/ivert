[build-system]
requires = ["hatchling>=1.5.0", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "ivert"
dynamic = ["version"]
description = "The ICESat-2 Validation of Elevations Reporting Tool (IVERT)"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Michael MacFerrin", email = "michael.macferrin@colorado.edu"},
]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = ["Geospatial"]
dependencies = [
    "click",
    "colorama; platform_system == 'Windows'",
    "dateparser",
    "geopandas",
    "h5py",
    "matplotlib",
    "netCDF4",
    "numexpr",
    "numpy",
    "pandas",
    "psutil",
    "pyproj",
    "rasterio",
    "scipy",
    "shapely",
    "six",
    "tables",
    "tabulate",
    "tqdm",
    "xarray",
    # 0.6.13 is the first release carrying the redirect-safe requests.Session
    # (fetchez#277). Before it, Harmony -> Earthdata Login -> Harmony dropped the
    # injected auth headers and the download died on a JSONDecodeError parsing the
    # login page it got back instead of JSON (#23).
    "fetchez>=0.6.13",
    "globato",
    "transformez",
]

[dependency-groups]
docs = [
    "sphinx<9.0.0",  # temp pin for sphinx-click
    "sphinx-autodoc-typehints>=2.0.1",
    "sphinx-click>=6.0",
    "pydata-sphinx-theme",
    "myst-parser",
]

[project.urls]
Source = "https://github.com/continuous-dems/ivert"

[project.scripts]
ivert = "ivert.cli:ivert_cli"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.version]
path = "src/ivert/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ivert"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN001",   # missing-type-function-argument
    "ANN201",   # missing-return-type-undocumented-public-function
    "ANN202",   # missing-return-type-private-function
    "ARG001",   # unused-function-argument
    "ARG002",   # unused-method-argument
    "BLE001",   # blind-except
    "C901",     # complex-structure
    "CPY001",   # missing-copyright-notice
    "D100",     # undocumented-public-module
    "D101",     # undocumented-public-class
    "D102",     # undocumented-public-method
    "D103",     # undocumented-public-function
    "D104",     # undocumented-public-package
    "D107",     # undocumented-public-init
    "D401",     # non-imperative-mood
    "D417",     # undocumented-param
    "E501",     # line-too-long
    "EM101",    # raw-string-in-exception
    "EM102",    # f-string-in-exception
    "ERA001",   # commented-out-code
    "FBT001",   # boolean-type-hint-positional-argument
    "FBT002",   # boolean-default-value-positional-argument
    "FIX002",   # line-contains-todo
    "PLC0415",  # import-outside-top-level
    "PLR0912",  # too-many-branches
    "PLR0913",  # too-many-arguments
    "PLR0915",  # too-many-statements
    "PLR0917",  # too-many-positional-arguments
    "PLR2004",  # magic-value-comparison
    "PLW0603",  # global-statement
    "PTH100",   # os-path-abspath
    "PTH102",   # os-mkdir
    "PTH103",   # os-makedirs
    "PTH107",   # os-remove
    "PTH109",   # os-getcwd
    "PTH110",   # os-path-exists
    "PTH111",   # os-path-expanduser
    "PTH112",   # os-path-isdir
    "PTH113",   # os-path-isfile
    "PTH117",   # os-path-isabs
    "PTH118",   # os-path-join
    "PTH119",   # os-path-basename
    "PTH120",   # os-path-dirname
    "PTH122",   # os-path-splitext
    "PTH123",   # builtin-open
    "PTH202",   # os-path-getsize
    "PTH207",   # glob
    "PTH208",   # os-listdir
    "S101",     # assert
    "S110",     # try-except-pass
    "S301",     # suspicious-pickle-usage
    "SIM115",   # open-file-with-context-handler
    "SLF001",   # private-member-access
    "TD002",    # missing-todo-author
    "TD003",    # missing-todo-link
    "TRY003",   # raise-vanilla-args
    "TRY004",   # type-check-without-type-error
]

[tool.ruff.lint.per-file-ignores]
"conf.py" = ["A001"]
