name: "Type check"

on:
  push:
    branches:
      - "main"
  pull_request:

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  mypy:
    name: "mypy"
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout code"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          persist-credentials: false

      - name: "Set up uv and Python"
        uses: "astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7"  # v10.2.0
        with:
          python-version: "3.12"
          activate-environment: "true"

      # mypy itself is pinned in the "typecheck" group; it needs IVERT's
      # dependencies installed to read their types.
      - name: "Install IVERT and mypy"
        run: |
          uv pip install -e .
          uv pip install --group typecheck
          uv pip list

      - name: "Run mypy"
        run: "mypy"
