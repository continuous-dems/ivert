name: "Tests"

on:
  push:
    branches:
      - "main"
  pull_request:

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    name: "pytest (Python ${{ matrix.python-version }}, ${{ matrix.resolution }} dependencies)"
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
        resolution: ["highest"]
        # Also install each dependency at the lowest version pyproject.toml
        # allows, so the suite fails if IVERT starts using something newer
        # than a stated minimum.
        include:
          - python-version: "3.12"
            resolution: "lowest-direct"

    steps:
      - name: "Checkout code"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          persist-credentials: false

      - name: "Set up uv and Python"
        uses: "astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7"  # v10.2.0
        with:
          python-version: "${{ matrix.python-version }}"
          activate-environment: "true"

      - name: "Install IVERT and its test dependencies"
        env:
          RESOLUTION: "${{ matrix.resolution }}"
        run: |
          uv pip install --resolution "$RESOLUTION" -e .
          uv pip install --group test
          uv pip list

      - name: "Run the test suite"
        run: "pytest -v --cov=ivert --cov-report=term-missing"
