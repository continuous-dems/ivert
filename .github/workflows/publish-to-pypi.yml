name: "Build & publish to PyPI"

on:
  pull_request:
  release:
    types:
      # Triggers when you click "Publish release" in GitHub
      - "published"

permissions: {}

jobs:
  build:
    name: "Build"
    runs-on: "ubuntu-latest"
    steps:
    - name: "Checkout code"
      uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
      with:
        persist-credentials: false

    - name: "Set up Python"
      uses: "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97"  # v7.0.0
      with:
        # Pinned to 3.13: fiona (pulled in via globato) has no cp314 wheels yet,
        # and building it from source requires the GDAL headers we no longer install.
        python-version: "3.13"

    - name: "Install build tools"
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: "Build package"
      run: "python -m build"

    - name: "Test built package"
      run: |
        python -m pip install dist/*.whl
        cd /tmp
        python -c "import ivert; print(f'Version: {ivert.__version__}')"
        ivert --version

    - uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"  # v7.0.1
      with:
        name: "dist"
        path: "dist/"

  pypi-publish:
    name: "Publish to PyPI"
    runs-on: "ubuntu-latest"
    if: "github.event_name == 'release'"
    needs: "build"
    environment:
      name: "pypi"
      url: "https://pypi.org/p/ivert"
    permissions:
      id-token: "write"
    steps:
    - name: "Get dist artifact"
      uses: "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c"  # v8.0.1
      with:
        name: "dist"
        path: "dist/"
    - name: "Publish to PyPI"
      uses: "pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33"  # v1.14.2
