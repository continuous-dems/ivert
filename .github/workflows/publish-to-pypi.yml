name: "Build & publish to PyPI"

on:
  pull_request:
  release:
    types:
      # Triggers when you click "Publish release" in GitHub
      - "published"

permissions: {}

jobs:
  build:
    name: "Build"
    runs-on: "ubuntu-latest"
    steps:
    - name: "Checkout code"
      uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
      with:
        persist-credentials: false
        # The whole history and its tags, so hatch-vcs can work out the
        # version (e.g. 0.7.1.devN) rather than falling back to 0.1.dev1.
        fetch-depth: 0

    - name: "Set up uv and Python"
      uses: "astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e"  # v10.3.2
      with:
        # IVERT is pure Python, so the built wheel is py3-none-any no matter
        # which interpreter runs here. This version is what the "Test built
        # package" step below exercises, so it tracks the newest release the
        # test matrix covers.
        python-version: "3.14"
        activate-environment: "true"
        # This workflow publishes to PyPI, so nothing is restored from a cache
        # into the build.
        enable-cache: "false"

    - name: "Build package"
      run: "uv build"

    - name: "Test built package"
      run: |
        uv pip install dist/*.whl
        cd /tmp
        python -c "import ivert; print(f'Version: {ivert.__version__}')"
        ivert --version

    - uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9"  # v7.0.2
      with:
        name: "dist"
        path: "dist/"

  pypi-publish:
    name: "Publish to PyPI"
    runs-on: "ubuntu-latest"
    if: "github.event_name == 'release'"
    needs: "build"
    environment:
      name: "pypi"
      url: "https://pypi.org/p/ivert"
    permissions:
      id-token: "write"
    steps:
    - name: "Get dist artifact"
      uses: "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333"  # v8.0.2
      with:
        name: "dist"
        path: "dist/"
    - name: "Publish to PyPI"
      uses: "pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086"  # v1.14.3
